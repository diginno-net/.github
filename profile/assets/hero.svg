<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="Diginno — Automation that removes busywork">
  <defs>
    <pattern id="px" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="300" fill="#111827"/>
  <rect width="1100" height="300" fill="url(#px)" opacity="0.55"/>
  <rect x="0" y="0" width="1100" height="6" fill="#00E599"/>
  <rect x="0" y="294" width="1100" height="6" fill="#0F766E"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">
    <text x="64" y="132" font-size="72" font-weight="700" fill="#F9FAFB" letter-spacing="6">DIGINNO</text>
    <rect x="424" y="82" width="32" height="50" fill="#00E599"/>

    <text x="64" y="176" font-size="24" fill="#00E599">Tự động hoá để bớt việc.</text>
    <text x="64" y="206" font-size="18" fill="#7DD3FC">Automation that removes busywork.</text>

    <g font-size="15">
      <rect x="64" y="234" width="122" height="34" fill="none" stroke="#00E599" stroke-opacity="0.5"/>
      <text x="82" y="256" fill="#00E599">LARK</text>
      <rect x="196" y="234" width="150" height="34" fill="none" stroke="#00E599" stroke-opacity="0.5"/>
      <text x="214" y="256" fill="#00E599">LARKBASE</text>
      <rect x="356" y="234" width="80" height="34" fill="none" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <text x="374" y="256" fill="#7DD3FC">n8n</text>
      <rect x="446" y="234" width="104" height="34" fill="none" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <text x="464" y="256" fill="#7DD3FC">AI OPS</text>
      <rect x="560" y="234" width="96" height="34" fill="none" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <text x="578" y="256" fill="#7DD3FC">DATA</text>
    </g>
  </g>

  <g>
    <rect x="770" y="56" width="270" height="188" fill="#0B1220" stroke="#374151"/>
    <rect x="770" y="56" width="270" height="28" fill="#1F2937"/>
    <circle cx="788" cy="70" r="5" fill="#EF4444"/>
    <circle cx="806" cy="70" r="5" fill="#FACC15"/>
    <circle cx="824" cy="70" r="5" fill="#22C55E"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="13.5">
      <text x="788" y="112" fill="#9CA3AF">$ diginno deploy --ops</text>
      <text x="788" y="140" fill="#00E599">✓ larkbase · crm · hrm</text>
      <text x="788" y="166" fill="#00E599">✓ n8n · production flows</text>
      <text x="788" y="192" fill="#7DD3FC">✓ ai agents · approvals</text>
      <text x="788" y="226" fill="#F9FAFB">manual work: 0<tspan fill="#00E599">▊</tspan></text>
    </g>
  </g>
</svg>
